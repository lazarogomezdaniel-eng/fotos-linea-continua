<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#192233"/>
      <stop offset="60%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#07090f"/>
    </radialGradient>
    <linearGradient id="goldCyanFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#iconBg)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#253046" stroke-width="3" opacity="0.6"/>
  
  <!-- Continuous Line Barcelona Flower & Infinity Helix Emblem -->
  <path d="M 256 120
           C 180 120, 140 180, 140 230
           C 140 285, 210 270, 256 256
           C 210 242, 140 227, 140 282
           C 140 332, 180 392, 256 392
           C 332 392, 372 332, 372 282
           C 372 227, 302 242, 256 256
           C 302 270, 372 285, 372 230
           C 372 180, 332 120, 256 120 Z"
        fill="none" stroke="url(#goldCyanFlow)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Outer Floral Lobes Ribbon -->
  <path d="M 256 70
           C 150 70, 80 160, 80 256
           C 80 352, 150 442, 256 442
           C 362 442, 432 352, 432 256
           C 432 160, 362 70, 256 70"
        fill="none" stroke="url(#goldCyanFlow)" stroke-width="8" stroke-dasharray="24 16" stroke-linecap="round" opacity="0.75"/>
        
  <!-- Golden Core Nucleus -->
  <circle cx="256" cy="256" r="26" fill="none" stroke="#f59e0b" stroke-width="9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="8" fill="#fef3c7"/>
</svg>
